[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoagent-njc-cabin-meal-allowance"
version = "0.2.0"
description = "Njc Cabin Meal Allowance: a NanoAgent plugin"
requires-python = ">=3.12"
dependencies = ["mcp>=1.27,<2", "slimconfig"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
slimconfig = { git = "https://github.com/zeyuyang8/slimconfig", branch = "master" }

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
# contract.py and verifier/ live at the plugin root.
pythonpath = ["."]
